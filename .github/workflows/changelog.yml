name: Auto Changelog

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: previoustag
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then
            PREV="v0.0.0"
          fi
          echo "tag=$PREV" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV"

      - name: Get current tag
        id: currenttag
        run: |
          CURR=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "latest")
          echo "tag=$CURR" >> $GITHUB_OUTPUT
          echo "Current tag: $CURR"

      - name: Generate changelog
        id: changelog
        run: |
          # Generate changelog from commit messages
          CHANGELOG=$(git log ${{ steps.previoustag.outputs.tag }}..HEAD --pretty=format:"- %s (%an, %h)" --no-merges)

          if [ -z "$CHANGELOG" ]; then
            echo "No new commits since last tag"
            echo "changelog=No new commits since ${{ steps.previoustag.outputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create PR with changelog
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update changelog for ${{ steps.currenttag.outputs.tag }}"
          title: "📝 Update Changelog for ${{ steps.currenttag.outputs.tag }}"
          body: |
            ## Changelog Update

            This PR updates the CHANGELOG.md with changes from ${{ steps.previoustag.outputs.tag }} to ${{ steps.currenttag.outputs.tag }}.

            ### Changes

            ${{ steps.changelog.outputs.changelog }}

            ---
            *Auto-generated by GitHub Actions*
          branch: chore/update-changelog
          delete-branch: true
          base: main
          add-paths: |
            CHANGELOG.md
            README.md
